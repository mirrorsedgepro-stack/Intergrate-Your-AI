name: Scan diagnose

# Manual: find out exactly which file inside a release's installers an antivirus signature matches, using a freshly
# updated ClamAV from Ubuntu (independent of the release scan's image). Nothing is published or changed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to inspect (may be a draft)
        required: true
      compare_tag:
        description: Another release tag to scan for comparison (optional)
        required: false

permissions:
  contents: write # needed only to see draft releases; this workflow never modifies anything

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install ClamAV + 7-Zip and update signatures
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clamav p7zip-full >/dev/null
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --quiet || sudo freshclam
          clamscan --version
      - name: Download installers
        run: |
          mkdir -p dl/new dl/old
          gh release download "$IN_TAG" --repo "$GITHUB_REPOSITORY" --dir dl/new --pattern '*.exe'
          if [ -n "$IN_COMPARE" ]; then gh release download "$IN_COMPARE" --repo "$GITHUB_REPOSITORY" --dir dl/old --pattern '*.exe'; fi
          sha256sum dl/*/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_TAG: ${{ inputs.tag }}
          IN_COMPARE: ${{ inputs.compare_tag }}
      - name: Scan the installers as shipped
        run: clamscan --no-summary --infected dl/new dl/old || true
      - name: Unpack the NSIS installers and scan every file inside
        run: |
          for exe in dl/*/*.exe; do
            out="x/$(basename "$(dirname "$exe")")"
            mkdir -p "$out"
            7z x -y -bd "$exe" -o"$out" >/dev/null
            for inner in $(find "$out" -name '*.7z'); do 7z x -y -bd "$inner" -o"${inner%.7z}" >/dev/null; done
          done
          echo "== files flagged inside the installers =="
          clamscan -r --infected --no-summary --max-filesize=500M --max-scansize=2000M x || true
          echo "== executables inside the new installer =="
          find x/new -iname '*.exe' -o -iname '*.dll' -o -iname '*.node' | sort | head -80
      - name: Scan the official, unmodified Electron build for comparison
        run: |
          v=$(node -p "require('./package.json').devDependencies.electron.replace(/^[^0-9]*/, '')" 2>/dev/null || true)
          [ -n "$v" ] || v=44.5.1
          echo "Electron $v"
          curl -sfL -o electron.zip "https://github.com/electron/electron/releases/download/v$v/electron-v$v-win32-x64.zip"
          mkdir -p electron-official && 7z x -y -bd electron.zip -oelectron-official >/dev/null
          sha256sum electron-official/electron.exe
          clamscan --infected --no-summary electron-official/electron.exe && echo "official electron.exe: clean" || echo "official electron.exe: FLAGGED (above)"

  # Second engine on the exact flagged binary: Microsoft Defender on a Windows runner.
  defender:
    runs-on: windows-latest
    steps:
      - name: Download and unpack the installer
        shell: bash
        run: |
          mkdir -p dl && gh release download "$IN_TAG" --repo "$GITHUB_REPOSITORY" --dir dl --pattern '*.exe'
          7z x -y -bd dl/*.exe -ox >/dev/null && 7z x -y -bd 'x/$PLUGINSDIR/app-64.7z' -ox/app >/dev/null
          sha256sum dl/*.exe x/app/Nexus.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_TAG: ${{ inputs.tag }}
          IN_COMPARE: ${{ inputs.compare_tag }}
      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Host "Defender is not available on this runner"; exit 0 }
          & $mp -SignatureUpdate | Select-Object -Last 1
          (Get-MpComputerStatus).AntivirusSignatureVersion
          foreach ($f in @(Get-ChildItem dl/*.exe) + @(Get-Item x/app/Nexus.exe)) {
            Write-Host "== $($f.Name)"
            & $mp -Scan -ScanType 3 -File $f.FullName -DisableRemediation | Select-Object -Last 2
          }

  # Does the release gate's own scanner flag the official, untouched Electron binary?
  gate-on-official-electron:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official Electron
        run: |
          v=44.5.1
          curl -sfL -o electron.zip "https://github.com/electron/electron/releases/download/v$v/electron-v$v-win32-x64.zip"
          sudo apt-get install -y -qq p7zip-full >/dev/null
          mkdir -p official && 7z x -y -bd electron.zip -oofficial electron.exe >/dev/null && rm electron.zip
          sha256sum official/electron.exe
      - name: Release-gate scanner on official electron.exe
        uses: hugoalh/scan-virus-ghaction@v0.20.1
        with:
          clamav_enable: 'True'
          clamav_update: 'True'
