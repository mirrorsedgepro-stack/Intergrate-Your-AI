name: AV check of Windows build variants

# Manual: build several Windows installer variants and scan each with the same action the release gate uses
# (hugoalh/scan-virus-ghaction) plus a freshly updated Ubuntu ClamAV, including the Nexus.exe inside each
# installer. Publishes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build variants
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          mkdir -p out
          build() { # name, target, extra electron-builder args
            rm -rf dist
            npx electron-builder --win "$2" --publish never $3 > "out/$1.log" 2>&1 || { echo "build $1 failed"; tail -20 "out/$1.log"; return; }
            mkdir -p "out/$1" && cp dist/*.exe dist/*.zip "out/$1/" 2>/dev/null || true
            echo "built $1: $(ls "out/$1")"
          }
          build A-nsis-default       nsis ""
          build B-nsis-noedit        nsis "-c.win.signAndEditExecutable=false"
          build C-nsis-store         nsis "-c.compression=store"
          build D-nsis-noedit-store  nsis "-c.win.signAndEditExecutable=false -c.compression=store"
          build E-zip                zip  ""
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: variants
          path: out/

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: variants
          path: variants
      - name: Unpack each variant's app (for per-file results)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clamav p7zip-full >/dev/null
          for d in variants/*/; do
            n=$(basename "$d")
            for f in "$d"*.exe "$d"*.zip; do
              [ -f "$f" ] || continue
              mkdir -p "unpacked/$n" && 7z x -y -bd "$f" -o"unpacked/$n" >/dev/null || true
              for inner in $(find "unpacked/$n" -name '*.7z'); do 7z x -y -bd "$inner" -o"${inner%.7z}" >/dev/null; done
            done
          done
          find unpacked -name Nexus.exe | sort
      - name: Gate engine (same action as the release)
        id: gate
        continue-on-error: true
        uses: hugoalh/scan-virus-ghaction@99c81e8991ad1074a14e5f22a21bce9be035e14e # v0.20.1
        with:
          clamav_enable: 'True'
          clamav_update: 'True'
      - name: Fresh ClamAV per variant
        run: |
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --quiet || sudo freshclam
          clamscan --version
          for d in variants/*/; do
            n=$(basename "$d")
            hits=$(clamscan -r --infected --no-summary --max-filesize=500M --max-scansize=2000M "$d" "unpacked/$n" 2>/dev/null || true)
            if [ -z "$hits" ]; then echo "CLEAN   $n"; else echo "FLAGGED $n"; echo "$hits" | sed 's/^/        /'; fi
          done
          echo "== hashes of each variant's Nexus.exe (official electron.exe 44.5.1 = 49b61a030a520fc36a4b8fa5cce53fb4e935a7bdbbe4b80e9222f598e49cc7fa)"
          find unpacked -name Nexus.exe -exec sha256sum {} \;

  defender:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: variants
          path: variants
      - name: Microsoft Defender per variant
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          & $mp -SignatureUpdate | Select-Object -Last 1
          "Defender signatures: " + (Get-MpComputerStatus).AntivirusSignatureVersion
          foreach ($f in Get-ChildItem variants -Recurse -Include *.exe, *.zip) {
            $r = & $mp -Scan -ScanType 3 -File $f.FullName -DisableRemediation | Select-Object -Last 1
            "{0}: {1}" -f $f.Directory.Name, $r
          }
