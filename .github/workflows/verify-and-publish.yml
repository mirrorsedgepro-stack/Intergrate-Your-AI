name: Verify and publish

# Scans a draft release's installers and publishes it if the blocking scan is clean.
#   Blocking:  Microsoft Defender (current signatures) on the Windows installer.
#   Reported:  ClamAV via hugoalh/scan-virus-ghaction on every installer (its bundled ClamAV has 2023 signatures and
#              has produced false positives before, so it doesn't block; its result is shown in the notes).
# VirusTotal is no longer part of a release: single-engine heuristic verdicts on the unsigned Windows installer held
# back 2.0.0 and 2.0.1. The manual "VirusTotal check" workflow (virustotal.yml) still gives a multi-engine verdict.
# Runs after every release build (called from release.yml) or manually for an existing draft.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (draft) to verify and publish
        required: true

permissions:
  contents: write

# GH_TOKEN is set per job/step, never workflow-wide: the third-party ClamAV action must not see a write token.
env:
  TAG: ${{ inputs.tag }}

jobs:
  clamav:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.scan.outputs.found }}
      outcome: ${{ steps.scan.outcome }}
    steps:
      - name: Download installers
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$GITHUB_WORKSPACE/release" \
            --pattern '*.exe' --pattern '*.dmg' --pattern '*.zip' --pattern '*.AppImage' --pattern '*.deb'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan Virus
        id: scan
        continue-on-error: true
        uses: hugoalh/scan-virus-ghaction@99c81e8991ad1074a14e5f22a21bce9be035e14e # v0.20.1
        with:
          clamav_enable: 'True'
          clamav_update: 'True'
          found_summary: 'True'
          statistics_summary: 'True'

  defender:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download Windows installer
        shell: bash
        run: mkdir -p dl && gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl --pattern '*.exe'
      - name: Microsoft Defender
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          & $mp -SignatureUpdate | Select-Object -Last 1
          $sig = (Get-MpComputerStatus).AntivirusSignatureVersion
          "Defender signatures: $sig"
          $bad = 0
          foreach ($f in Get-ChildItem dl -Filter *.exe) {
            $r = (& $mp -Scan -ScanType 3 -File $f.FullName -DisableRemediation | Select-Object -Last 1)
            "$($f.Name): $r"
            if ($r -notmatch 'found no threats') { $bad++ }
          }
          "- Microsoft Defender (signatures $sig): " + ($(if ($bad) { 'THREATS FOUND' } else { 'no threats' })) | Out-File defender.md -Encoding utf8
          if ($bad) { Write-Error "Defender found threats"; exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: defender
          path: defender.md
          overwrite: true

  publish:
    needs: [clamav, defender]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: results
      - name: Checksums
        run: |
          mkdir -p dl && gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl \
            --pattern '*.exe' --pattern '*.dmg' --pattern '*.zip' --pattern '*.AppImage' --pattern '*.deb'
          (cd dl && sha256sum *) > SHA256SUMS.txt
      - name: Publish release with scan results
        env:
          CLAM_FOUND: ${{ needs.clamav.outputs.found }}
          CLAM_OUTCOME: ${{ needs.clamav.outputs.outcome }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$CLAM_OUTCOME" = success ] && [ "$CLAM_FOUND" != True ] && [ "$CLAM_FOUND" != true ]; then
            clam="- ClamAV ([hugoalh/scan-virus-ghaction](https://github.com/hugoalh/scan-virus-ghaction)): no threats"
          else
            clam="- ClamAV ([hugoalh/scan-virus-ghaction](https://github.com/hugoalh/scan-virus-ghaction), bundled ClamAV 1.0.3 with 2023 signatures): reported a finding or did not complete; see the scan log. Microsoft Defender found nothing."
          fi
          {
            echo
            echo "### Security scan"
            echo "Every installer was checked before this release was published ([scan log]($run)):"
            echo
            cat results/defender.md
            echo "$clam"
            echo
            echo "SHA-256 checksums (also attached as SHA256SUMS.txt):"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> notes.md
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --draft=false --latest
