name: Release

# Push a tag like v2.0.0 (matching "version" in Cargo.toml), or push a "version" bump in Cargo.toml to main, to build
# installers for Windows, macOS and Linux. (A version bump on main releases v<version> unless that tag or release
# already exists; the tag is created when the release is published.)
# They are uploaded to a draft release, scanned (VirusTotal + Microsoft Defender block; ClamAV is reported), and the
# release is published only if the blocking scans are clean.
# Installed copies of Nexus then pick it up automatically.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: [Cargo.toml, .github/workflows/release.yml]

permissions:
  contents: write

jobs:
  # Which release this run is for, and whether to make one at all (a Cargo.toml change that isn't a new version
  # doesn't release).
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      go: ${{ steps.v.outputs.go }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already exists: nothing to release"; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $tag from $GITHUB_SHA"; echo "go=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Create the (draft) release once, before any build uploads to it; parallel uploaders would otherwise each create one.
  create:
    needs: version
    if: needs.version.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "${TAG#v}" \
            --notes "Nexus ${TAG#v}. Windows: Nexus-Setup-*.exe · macOS: *-mac-arm64.dmg (Apple Silicon) or *-mac-x64.dmg (Intel) · Linux: .deb (x86_64 / arm64)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}

  build:
    needs: [version, create]
    strategy:
      fail-fast: false
      matrix:
        # Windows: Nexus-Setup-<v>.exe · macOS: .dmg/.zip for Apple Silicon and Intel · Linux: .deb for amd64 and arm64
        os: [windows-latest, macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustc --version
      - name: tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Check the tag matches Cargo.toml
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          v="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          [ "$v" = "$TAG" ] || { echo "::error::Cargo.toml says $v but the release is $TAG"; exit 1; }
      - run: cargo test --locked
      # Code signing switches on when its secrets exist (README: Development); without them the builds are unsigned
      # (the macOS app is ad-hoc signed so it runs on Apple Silicon).
      - name: Signing certificate (Windows)
        if: runner.os == 'Windows' && env.PFX != ''
        shell: bash
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          printf '%s' "$PFX" | base64 -d > "$RUNNER_TEMP/sign.pfx"
          echo "WINDOWS_CERT_PFX=$RUNNER_TEMP/sign.pfx" >> "$GITHUB_ENV"
      - name: Signing certificate (macOS)
        if: runner.os == 'macOS' && env.P12 != ''
        shell: bash
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"; pw="$(uuidgen)"
          printf '%s' "$P12" | base64 -d > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/sign.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          rm -f "$RUNNER_TEMP/sign.p12"
      - name: Build installers
        shell: bash
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/package.sh
      - name: Remove the signing certificate
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/sign.pfx"; security delete-keychain "$RUNNER_TEMP/sign.keychain-db" 2>/dev/null || true
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  # VirusTotal + Microsoft Defender gate (blocking) and ClamAV (reported), then publish: see verify-and-publish.yml.
  verify:
    needs: [version, build]
    uses: ./.github/workflows/verify-and-publish.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
