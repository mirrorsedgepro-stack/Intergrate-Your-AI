name: Release

# Push a tag like v1.3.0 (matching package.json "version"), or push a "version" bump in package.json to main, to build
# installers for Windows, macOS and Linux. (A version bump on main releases v<version> unless that tag or release
# already exists; the tag is created when the release is published.)
# They are uploaded to a draft release, scanned (VirusTotal + Microsoft Defender block; ClamAV is reported), and the
# release is published only if the blocking scans are clean.
# Installed copies of Nexus then pick it up automatically.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]

permissions:
  contents: write

jobs:
  # Which release this run is for, and whether to make one at all (a package.json change that isn't a new version
  # doesn't release).
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      go: ${{ steps.v.outputs.go }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tag="v$(node -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already exists: nothing to release"; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $tag from $GITHUB_SHA"; echo "go=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Create the (draft) release once, before any build uploads to it; parallel uploaders would otherwise each create one.
  create:
    needs: version
    if: needs.version.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "${TAG#v}" \
            --notes "Nexus ${TAG#v}. Windows: Nexus-Setup-*.exe · macOS: *-mac-arm64.dmg (Apple Silicon) or *-mac-x64.dmg (Intel) · Linux: .deb (x86_64 / arm64)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux --x64
          - os: ubuntu-24.04-arm
            args: --linux --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Code signing is used when its secrets exist, so updates and SmartScreen/Gatekeeper can verify the publisher.
      # Without them the build stays unsigned, as before. Secrets: WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD (Windows .pfx,
      # base64), MAC_CSC_LINK + MAC_CSC_KEY_PASSWORD (Developer ID .p12, base64), APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD
      # + APPLE_TEAM_ID (notarization).
      - name: Build, sign (if configured) and upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ "$RUNNER_OS" = macOS ] && [ -n "${CSC_LINK:-}" ]; then
            # package.json pins mac.identity to null (unsigned); drop that for this build so the certificate is used.
            node -e 'const f="package.json",p=require("./"+f);delete p.build.mac.identity;require("fs").writeFileSync(f,JSON.stringify(p,null,2))'
            echo "Signing the macOS build"
          fi
          [ "$RUNNER_OS" = Windows ] && [ -n "${WIN_CSC_LINK:-}" ] && echo "Signing the Windows build"
          npx electron-builder ${{ matrix.args }} --publish always

  # VirusTotal + Microsoft Defender gate (blocking) and ClamAV (reported), then publish: see verify-and-publish.yml.
  verify:
    needs: [version, build]
    uses: ./.github/workflows/verify-and-publish.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
