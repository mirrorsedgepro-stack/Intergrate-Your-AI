name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      # Install scripts are skipped: the tests need no Electron binary or native builds.
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Syntax check
        shell: bash
        run: for f in main.js preload.js lib/*.js renderer/app.js; do node --check "$f"; done
      - name: Shell script syntax
        shell: bash
        run: bash -n scripts/linux-bootstrap.sh && bash -n scripts/setup-ssh-key.sh
