[package]
name = "nexus-terminal"
version = "2.0.4"
edition = "2021"
rust-version = "1.95"
description = "One terminal to orchestrate Claude, Antigravity, OpenClaw and shells across your machines (Windows, macOS, Linux, WSL)"
authors = ["mirrorsedgepro-stack"]
repository = "https://github.com/mirrorsedgepro-stack/Intergrate-Your-AI"
homepage = "https://github.com/mirrorsedgepro-stack/Intergrate-Your-AI"
publish = false
default-run = "nexus"

[[bin]]
name = "nexus"
path = "src/main.rs"

# MCP stdio bridge: `claude mcp add nexus -- <path>/nexus-mcp`
[[bin]]
name = "nexus-mcp"
path = "src/bin/nexus-mcp.rs"

[dependencies]
# "clipboard" is what connects copy and paste to the system clipboard: without it egui keeps a private one that
# only works inside Nexus.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "clipboard"] }
# Colour glyphs (emoji) in the terminal and UI text.
epaint = { version = "0.37", default-features = false, features = ["color_fonts"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
alacritty_terminal = "0.26"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
portable-pty = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3", features = ["json"] }
notify-rust = "4"
keyring = "4"
rfd = "0.18"
open = "5"
fontdb = "0.24"
base64 = "0.23"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
regex = "1"
rand = "0.10"
fd-lock = "4"
dirs = "7"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

# Linux package: `cargo deb` (cargo install cargo-deb). Same package name as the Electron builds, so apt upgrades in place.
[package.metadata.deb]
name = "nexus-terminal"
maintainer = "mirrorsedgepro-stack <mirrorsedgepro-stack@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "$auto, openssh-client, libxkbcommon0, libgl1"
recommends = "libx11-6, libxcursor1, libxi6, libxkbcommon-x11-0, libwayland-client0, libwayland-egl1"
extended-description = "Nexus runs Claude Code, the Antigravity CLI, OpenClaw and shells on this computer and on any Linux machine you can SSH into, side by side, in tmux sessions that survive disconnects."
assets = [
    ["target/release/nexus", "usr/bin/nexus", "755"],
    ["target/release/nexus-mcp", "usr/bin/nexus-mcp", "755"],
    ["packaging/linux/nexus.desktop", "usr/share/applications/nexus.desktop", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/256x256/apps/nexus.png", "644"],
    ["assets/icon-1024.png", "usr/share/icons/hicolor/1024x1024/apps/nexus.png", "644"],
]
