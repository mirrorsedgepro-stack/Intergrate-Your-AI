<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Nexus</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/400.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/700.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/400-italic.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/inter/400.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/inter/500.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/inter/600.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <div class="brand"><span class="brand-mark"></span><span class="brand-name">nexus</span></div>
      <div id="tabs" class="tabs"></div>
      <div class="title-actions">
        <button class="icon-btn" id="btn-team" title="Team chat (Ctrl+Shift+M)"><svg viewBox="0 0 24 24"><path d="M4 5.5h16v10H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg><span id="team-badge" class="badge" hidden></span></button>
        <button class="icon-btn" id="btn-share" title="Share machines over Tailscale"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c2.6.1 4.4 1.7 5 4.8"/></svg></button>
        <button class="icon-btn" id="btn-workspaces" title="Workspaces (Ctrl+Shift+O)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 3v18M3 12h9"/></svg></button>
        <button class="icon-btn" id="btn-palette" title="Command palette (Ctrl+Shift+P)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg></button>
        <div class="layout-switch" id="layout-switch" title="Layout (Ctrl+Shift+L)">
          <button data-layout="1" title="Single"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2"/></svg></button>
          <button data-layout="2" title="Side by side"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5.2" height="12" rx="1.6"/><rect x="8.8" y="2" width="5.2" height="12" rx="1.6"/></svg></button>
          <button data-layout="4" title="Grid"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5.2" height="5.2" rx="1.4"/><rect x="8.8" y="2" width="5.2" height="5.2" rx="1.4"/><rect x="2" y="8.8" width="5.2" height="5.2" rx="1.4"/><rect x="8.8" y="8.8" width="5.2" height="5.2" rx="1.4"/></svg></button>
        </div>
      </div>
    </header>

    <aside id="sidebar">
      <div id="machines"></div>
      <div class="sidebar-foot">
        <button class="foot-btn" id="btn-composer" title="Composer (Ctrl+Shift+Enter)"><svg viewBox="0 0 24 24"><path d="M4 20l16-8L4 4v6l10 2-10 2z"/></svg><span>Broadcast</span></button>
        <button class="foot-btn" id="btn-settings" title="Settings (Ctrl+,)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button>
      </div>
    </aside>

    <main id="stage">
      <div id="panes" class="panes"></div>
      <div id="welcome" class="welcome"></div>
      <aside id="team" class="team" hidden>
        <div class="team-head"><b>Team</b><span id="team-hub" class="team-hub"></span><span class="spacer"></span><button class="icon-btn" id="team-close" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div id="team-people" class="team-people"></div>
        <div id="team-msgs" class="team-msgs"></div>
        <div class="team-compose"><textarea id="team-input" rows="2" placeholder="Message the team · @name to ping · /status to set yours"></textarea><button class="btn primary sm" id="team-send">Send</button></div>
      </aside>
      <section id="composer" class="composer" hidden>
        <div class="composer-head">
          <span class="composer-title">Broadcast prompt</span>
          <div id="composer-targets" class="chips"></div>
          <button class="icon-btn" id="composer-close" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <textarea id="composer-text" rows="4" placeholder="Write once, send to every selected session.   Ctrl+Enter to send"></textarea>
        <div class="composer-foot">
          <label class="check"><input type="checkbox" id="composer-submit" checked><span>Press Enter after sending</span></label>
          <span class="spacer"></span>
          <span class="hint">Ctrl+Enter</span>
          <button class="btn primary" id="composer-send">Send</button>
        </div>
      </section>
    </main>

    <footer id="statusbar">
      <span id="status-left"></span>
      <span class="spacer"></span>
      <span id="status-right" class="hint-keys">
        <kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>P</kbd> palette
        <kbd>Ctrl</kbd><kbd>1-9</kbd> switch
        <kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>O</kbd> workspaces
        <kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>⏎</kbd> broadcast
      </span>
    </footer>
  </div>

  <div id="palette" class="overlay" hidden>
    <div class="palette">
      <input id="palette-input" placeholder="Switch session, launch Claude / Antigravity / OpenClaw / Shell on any machine…" autocomplete="off" spellcheck="false">
      <div id="palette-list" class="palette-list"></div>
    </div>
  </div>

  <div id="settings" class="overlay" hidden>
    <div class="modal" tabindex="-1">
      <div class="modal-head"><h2>Settings</h2><button class="icon-btn" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="modal-body" id="settings-body"></div>
      <div class="modal-foot">
        <button class="btn ghost" id="settings-open-file">Open config file</button>
        <span class="spacer"></span>
        <button class="btn" data-close>Cancel</button>
        <button class="btn primary" id="settings-save">Save</button>
      </div>
    </div>
  </div>

  <div id="ctxmenu" class="ctxmenu" hidden></div>
  <div id="toasts" class="toasts"></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
  <script src="util.js"></script>
  <script src="app.js"></script>
</body>
</html>
